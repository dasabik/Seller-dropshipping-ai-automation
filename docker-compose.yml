services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seller_dropshipping_db
      POSTGRES_USER: seller_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seller_app -d seller_dropshipping_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DATABASE_URL: postgresql://seller_app:${POSTGRES_PASSWORD}@db:5432/seller_dropshipping_db
      DATABASE_SSL: "false"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
    ports:
      - "${PORT:-5000}:5000"

volumes:
  postgres_data:
